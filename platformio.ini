; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32@6.3.1
board = esp32-s3-devkitc-1
framework = arduino

board_build.f_cpu = 240000000L

; Lowered from the board default (921600) — that speed is a common cause of
; "Serial data stream stopped: Possible serial noise or corruption" on
; marginal cables/USB-UART bridges/hubs. 460800 is a safer middle ground;
; drop to 115200 below if uploads still fail.
upload_speed = 460800

monitor_filters = esp32_exception_decoder
monitor_speed = 115200

lib_deps = 
    lovyan03/LovyanGFX @ 1.1.12
    # SmoothUIToolKit included locally in lib/